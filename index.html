<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F4F3F0" />
    <script>
      // Old shared links used hash routes (/#/album/x). Send them to the real URL.
      (function () {
        var h = location.hash
        if (h.indexOf('#/') !== 0) { document.documentElement.className = 'js'; return }
        var p = h.slice(1).replace(/\/+$/, '')
        var en = /^\/en(\/|$)/.test(location.pathname)
        var m = p.match(/^\/(?:album|obra)\/([a-z0-9-]+)$/)
        var to = m ? (en ? '/en/projects/' : '/proyectos/') + m[1] + '/'
          : p === '/proyectos' || p === '/obras' ? (en ? '/en/projects/' : '/proyectos/')
          : p === '/cotizar' ? (en ? '/en/quote/' : '/cotizar/')
          : en ? '/en/' : '/'
        location.replace(to)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--app-head-->
    <title>Estructuras del Pacífico</title>
    <!--/app-head-->
    <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lora-latin.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
